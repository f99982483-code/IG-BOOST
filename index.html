<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growvin</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f2027;
  color:#fff;
}
.page{
  display:none;
  min-height:100vh;
  padding:40px 20px;
  box-sizing:border-box;
  text-align:center;
}
#page1{display:block;}
.btn{
  background:#25D366;
  color:#fff;
  padding:14px 30px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
}
.btn.blue{background:#1e90ff}
input,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:none;
  font-size:16px;
}
.card{
  max-width:420px;
  margin:20px auto;
  background:#fff;
  color:#000;
  padding:25px;
  border-radius:12px;
}
.qr{
  width:220px;
  margin:20px auto;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <h1>Welcome to Growvin</h1>
  <p>Boost Your Instagram Growth 🚀</p>

  <div class="card">
    <p>✔️ Real Followers</p>
    <p>✔️ Fast Delivery</p>
    <p>✔️ Trusted Service</p>

    <button class="btn" onclick="go(2)">Continue</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h2>Enter Your Details</h2>

  <div class="card">
    <input id="name" placeholder="Name" required>
    <input id="mobile" placeholder="Mobile Number" required>
    <input id="insta" placeholder="Instagram ID" required>

    <select id="followers" required>
      <option value="">Select Followers Plan</option>
      <option value="1K - ₹28">1K - ₹28</option>
      <option value="5K - ₹50">5K - ₹50</option>
      <option value="10K - ₹100">10K - ₹100</option>
      <option value="20K - ₹200">20K - ₹200</option>
    </select>

    <button class="btn blue" onclick="payNow()">Pay Now</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h2>Scan & Pay</h2>
  <img src="myqr.png" class="qr">
  <p>Payment complete chesi continue cheyyandi</p>

  <button class="btn" onclick="go(4)">I Have Paid</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h2>🎉 Thank You</h2>
  <p>Within <b>24 Hours</b> followers add avuthai</p>
  <button class="btn" onclick="go(1)">Back to Home</button>
</div>

<script>
function go(n){
  document.querySelectorAll('.page').forEach(p=>{
    p.style.display="none";
  });
  document.getElementById("page"+n).style.display="block";
}

function payNow(){
  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const insta = document.getElementById("insta").value.trim();
  const followers = document.getElementById("followers").value;

  if(name==="" || mobile==="" || insta==="" || followers===""){
    alert("Please fill all required fields");
    return;
  }
  go(3);
}
</script>

</body>
</html>
