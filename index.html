<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Followers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  text-align:center;
}
.page{display:none; padding:30px}
.page.active{display:block}
input,select{
  width:90%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button{
  padding:14px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#1e90ff;
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 15px rgba(30,144,255,0.6);
}
button:hover{
  box-shadow:0 0 25px rgba(30,144,255,1);
}
.qr{width:200px;margin:20px auto}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
  <h2>Enter Instagram Username</h2>
  <input id="username" placeholder="@username" required>
  <br>
  <button onclick="go(2)">Continue</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
  <h2>Enter Details</h2>
  <input id="name" placeholder="Name" required>
  <input id="mobile" placeholder="Mobile Number" required>
  <select id="package">
    <option value="">Select Package</option>
    <option>1K Followers</option>
    <option>5K Followers</option>
    <option>10K Followers</option>
  </select>
  <button onclick="go(3)">Pay Now</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
  <h2>Scan & Pay</h2>
  <img src="https://via.placeholder.com/200?text=QR" class="qr">
  <p>Upload Payment Screenshot</p>
  <input type="file" id="file" accept="image/*">
  <button onclick="submitData()">Submit</button>
  <p id="timer"></p>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
  <h2>🎉 Thank You</h2>
  <p>Within <b>24 Hours</b> followers will be added</p>
</div>

<script>
// 🔗 PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby2n7kUfC9rRAE_ozyK5G5BGjWA7Z-PeSj4GG1SldXLSNTuxEZS63zm0-vfVNZ8ENSZRQ/exec";

function go(n){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("p"+n).classList.add("active");
}

function submitData(){
  if(document.getElementById("file").files.length===0){
    alert("Upload screenshot");
    return;
  }

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      username:username.value,
      name:name.value,
      mobile:mobile.value,
      package:package.value
    })
  }).then(()=>{
    let t=5;
    timer.innerHTML="Verifying "+t;
    let i=setInterval(()=>{
      t--;
      timer.innerHTML="Verifying "+t;
      if(t===0){
        clearInterval(i);
        go(4);
      }
    },1000);
  });
}
</script>

</body>
</html>
