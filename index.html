<!DOCTYPE html>
<html>
<head>
  <title>Growvin</title>
  <style>
    body{font-family:Arial;background:#f2f2f2;margin:0}
    .page{display:none;padding:30px}
    .active{display:block}
    input,select,button{
      width:100%;padding:12px;margin:10px 0;font-size:16px
    }
    button{background:#007bff;color:#fff;border:none}
    img{max-width:100%}
  </style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <h2>Welcome to Growvin 🚀</h2>
  <p>Grow your Instagram fast</p>
  <button onclick="go(2)">Apply Now</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h2>Enter Details</h2>

  <input id="name" placeholder="Full Name" required>
  <input id="mobile" placeholder="Mobile Number" required>
  <input id="instagram" placeholder="Instagram ID" required>

  <select id="package" required>
    <option value="">Select Package</option>
    <option value="5K Followers">5K Followers</option>
    <option value="10K Followers">10K Followers</option>
  </select>

  <button onclick="sendToSheet()">Pay Now</button>
</div>

<!-- PAGE 3 (QR PAYMENT) -->
<div class="page" id="page3">
  <h2>Scan & Pay</h2>
  <p>PhonePe / GPay / Paytm</p>

  <!-- QR IMAGE -->
  <img src="myqr.png" alt="Payment QR"
       style="width:250px;display:block;margin:auto;">

  <br>
  <button onclick="go(4)">I Have Paid</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h2>Thank You 🙏</h2>
  <p>Within 24 hours followers will be delivered</p>
</div>

<script>
function go(n){
  document.querySelectorAll('.page')
    .forEach(p=>p.classList.remove('active'));
  document.getElementById("page"+n)
    .classList.add('active');
}

function sendToSheet(){
  var data={
    name:document.getElementById("name").value,
    mobile:document.getElementById("mobile").value,
    instagram:document.getElementById("instagram").value,
    package:document.getElementById("package").value
  };

  fetch("https://script.google.com/macros/s/AKfycbxRuJo0X69JyjECXT0Lgm4G7XQK32_5RZlLAsnaNFlLnUsqrLemmn8tLJdGYM8sniQ/exec",{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(()=>go(3))
  .catch(()=>alert("Error"));
}
</script>

</body>
</html>
