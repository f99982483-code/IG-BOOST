<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Boost</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.logo{
font-size:30px;
font-weight:bold;
margin-bottom:20px;
}

input, select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:8px;
background:#0095f6;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1877f2;
box-shadow:0 0 15px #0095f6,0 0 25px #0095f6;
transform:scale(1.05);
}

.qr{
width:200px;
margin-top:15px;
}

.hidden{
display:none;
}

#preview{
width:100%;
margin-top:10px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">Instagram</div>

<input type="text" id="username" placeholder="Enter Username" required>

<select id="package" required>
<option value="">Select Package</option>
<option value="1K Followers - ₹28">1K Followers - ₹28</option>
<option value="5K Followers - ₹120">5K Followers - ₹120</option>
<option value="10K Followers - ₹220">10K Followers - ₹220</option>
</select>

<button onclick="showQR()">Continue</button>

<div id="paymentSection" class="hidden">

<h3>Scan & Pay</h3>

<img src="myqr.png" class="qr">

<input type="file" id="screenshot" accept="image/*">

<img id="preview">

<button onclick="submitData()">Upload Screenshot</button>

</div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbw4BvEdVbYvOZr7tswFcozNM8987yEaIuTxkDAqAbxQmwoVl1NgUVZSTGoAHyE-f9dJ/exec";

function showQR(){

let username = document.getElementById("username").value;
let pkg = document.getElementById("package").value;

if(username=="" || pkg==""){
alert("Please fill all details");
return;
}

document.getElementById("paymentSection").classList.remove("hidden");

}

document.getElementById("screenshot").addEventListener("change", function(){

let file = this.files[0];
let preview = document.getElementById("preview");

if(file){
preview.src = URL.createObjectURL(file);
preview.style.display="block";
}

});

function submitData(){

let username = document.getElementById("username").value;
let pkg = document.getElementById("package").value;
let file = document.getElementById("screenshot").files[0];

if(!file){
alert("Upload screenshot");
return;
}

let reader = new FileReader();

reader.onload = function(){

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
username:username,
package:pkg,
screenshot:reader.result
})
})
.then(res=>res.text())
.then(data=>{
alert("Submitted Successfully ✅");

document.getElementById("username").value="";
document.getElementById("package").value="";
document.getElementById("screenshot").value="";
document.getElementById("preview").style.display="none";
document.getElementById("paymentSection").classList.add("hidden");
})
.catch(err=>{
alert("Error submitting ❌");
});

};

reader.readAsDataURL(file);

}

</script>

</body>
</html>
