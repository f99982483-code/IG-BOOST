<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growvin</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f2027;
  color:#fff;
}
.page{
  display:none;
  min-height:100vh;
  padding:40px 20px;
  text-align:center;
}
.active{display:block;}
.btn{
  background:#25D366;
  color:#fff;
  padding:14px 30px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
}
.btn.blue{background:#1e90ff}
.btn.dark{background:#2c5364}
input,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:none;
  font-size:16px;
}
.card{
  max-width:420px;
  margin:20px auto;
  background:#fff;
  color:#000;
  padding:25px;
  border-radius:12px;
}
.qr{
  width:220px;
  margin:20px auto;
}
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#fff;
  padding:14px 18px;
  border-radius:50%;
  font-size:22px;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <h1>Welcome to Growvin</h1>
  <p>Boost Your Instagram Growth 🚀</p>
  <br>
  <button class="btn" onclick="go(2)">Continue</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <h2>Enter Your Details</h2>
  <div class="card">
    <input id="name" placeholder="Name" required>
    <input id="mobile" placeholder="Mobile Number" required>
    <input id="insta" placeholder="Instagram ID" required>

   <select id="followers" required>
  <option value="">Followers Range</option>
  <option value="1K - ₹28">1K - ₹28</option>
  <option value="5K - ₹50">5K - ₹50</option>
  <option value="10K - ₹100">10K - ₹100</option>
  <option value="20K - ₹200">20K - ₹200</option>
</select>


    <button class="btn blue" onclick="sendToSheet()">Pay Now</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h2>Scan & Pay</h2>
  <img src="myqr.png" class="qr">
  <br>
  <button class="btn dark" onclick="go(4)">Payment Done</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h2>Thank You 🎉</h2>
  <p>Within 24 Hours Followers Will Be Added</p>
  <br>
  <button class="btn" onclick="go(1)">Back to Home</button>
</div>

<a href="https://wa.me/919703760912" target="_blank" class="whatsapp">💬</a>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxRuJo0X69JyjECXT0Lgm4G7XQK32_5RZlLAsnaNFlLnUsqrLemmn8tLJdGYM8sniQ/exec";

function go(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+n).classList.add('active');
}
    function sendToSheet(){

  const nameVal = document.getElementById("name").value.trim();
  const mobileVal = document.getElementById("mobile").value.trim();
  const instaVal = document.getElementById("insta").value.trim();
  const followersVal = document.getElementById("followers").value;

  if(nameVal === "" || mobileVal === "" || instaVal === "" || followersVal === ""){
    alert("Please fill all details");
    return;
  }

  go(3);
}

  }

  fetch(scriptURL,{
    method:'POST',
    body:new FormData(Object.assign(document.createElement('form'),{
      name:name.value,
      mobile:mobile.value,
      insta:insta.value,
      followers:followers.value
    }))
  });

  go(3);
}
</script>

</body>
</html>
