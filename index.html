<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram UI Clone</title>

<style>
/* Instagram background */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Main card */
.container {
  background: white;
  width: 350px;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.3);
}

/* Instagram title */
.title {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 20px;
}

/* Input fields */
input[type="text"],
input[type="file"] {
  width: 90%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
}

/* Blue button */
button {
  width: 95%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #0095f6;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

/* Hover glow effect */
button:hover {
  background: #1877f2;
  box-shadow: 0 0 15px #0095f6, 0 0 30px #0095f6;
  transform: scale(1.05);
}

/* Image preview */
#preview {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
  display: none;
}

.status {
  margin-top: 10px;
  font-size: 14px;
  color: green;
}

</style>
</head>
<body>

<div class="container">

<div class="title">Instagram</div>

<input type="text" id="username" placeholder="Username">

<input type="file" id="imageUpload" accept="image/*">

<img id="preview">

<button onclick="uploadData()">Upload</button>

<div class="status" id="status"></div>

</div>

<script>

// CHANGE THIS TO YOUR GOOGLE SCRIPT URL
const scriptURL = "https://script.google.com/macros/s/AKfycbw4BvEdVbYvOZr7tswFcozNM8987yEaIuTxkDAqAbxQmwoVl1NgUVZSTGoAHyE-f9dJ/exec";

// Image preview
document.getElementById("imageUpload").addEventListener("change", function() {

  const file = this.files[0];
  const preview = document.getElementById("preview");

  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }

});


// Upload function
function uploadData() {

  const username = document.getElementById("username").value;
  const file = document.getElementById("imageUpload").files[0];

  if(!username || !file){
    alert("Enter username and select image");
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {

    const base64 = reader.result.split(",")[1];

    fetch(scriptURL, {
      method: "POST",
      body: JSON.stringify({
        username: username,
        image: base64,
        filename: file.name
      })
    })
    .then(res => res.text())
    .then(data => {
      document.getElementById("status").innerHTML = "Upload successful ✅";
    })
    .catch(err => {
      document.getElementById("status").innerHTML = "Upload failed ❌";
    });

  };

  reader.readAsDataURL(file);

}

</script>

</body>
</html>
