<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Boost</title>

<style>

body{
margin:0;
font-family: Arial, sans-serif;
background: linear-gradient(45deg,#405DE6,#5851DB,#833AB4,#C13584,#E1306C,#FD1D1D,#F56040,#F77737,#FCAF45,#FFDC80);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.page{
display:none;
width:100%;
max-width:400px;
}

.active{
display:block;
}

.card{
background:white;
color:black;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.3);
}

h1{
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

.btn{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:18px;
color:white;
background:#0095f6;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
background:#1877f2;
box-shadow:0 0 15px #0095f6;
}

.qr{
width:220px;
margin:20px auto;
display:block;
}

.timer{
font-size:22px;
font-weight:bold;
color:#0095f6;
}

.thank{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

</style>
</head>
<body>

<!-- PAGE 1 USERNAME -->
<div class="page active" id="page1">

<div class="card">

<h1>Instagram</h1>

<input id="username" placeholder="Enter Instagram Username">

<button class="btn" onclick="next1()">Continue</button>

</div>
</div>


<!-- PAGE 2 DETAILS -->
<div class="page" id="page2">

<div class="card">

<h1>Enter Details</h1>

<input id="name" placeholder="Full Name">

<input id="mobile" placeholder="Mobile Number">

<select id="package">
<option value="">Select Package</option>
<option>1K Followers ₹28</option>
<option>5K Followers ₹50</option>
<option>10K Followers ₹100</option>
<option>20K Followers ₹200</option>
<option>50K Followers ₹500</option>
</select>

<button class="btn" onclick="next2()">Continue</button>

</div>
</div>


<!-- PAGE 3 PAYMENT -->
<div class="page" id="page3">

<div class="card">

<h1>Scan & Pay</h1>

<img src="myqr.png" class="qr">

<input type="file" id="file">

<button class="btn" onclick="upload()">Upload</button>

<p class="timer" id="timer"></p>

</div>
</div>


<!-- PAGE 4 THANK YOU -->
<div class="page" id="page4">

<div class="card thank">

<h1>Thank You ❤️</h1>

<p>Followers will be delivered within</p>

<h2>24 Hours</h2>

</div>

</div>



<script>

function show(page)
{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(page).classList.add("active");
}



function next1()
{

let username=document.getElementById("username").value;

if(username=="")
{
alert("Enter Username");
return;
}

show("page2");

}



function next2()
{

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let package=document.getElementById("package").value;

if(name=="" || mobile=="" || package=="")
{
alert("Fill all details");
return;
}

show("page3");

}



function upload()
{

let file=document.getElementById("file").files.length;

if(file==0)
{
alert("Upload Screenshot");
return;
}

let time=5;

document.getElementById("timer").innerHTML="Verifying "+time;

let interval=setInterval(function(){

time--;

document.getElementById("timer").innerHTML="Verifying "+time;

if(time==0)
{
clearInterval(interval);

show("page4");

}

},1000);

}

</script>


</body>
</html>
